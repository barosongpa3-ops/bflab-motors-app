<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132d44"><meta name="description" content="비플랩모터스 기사·정비사 통합 접속"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>BFLAB MOTORS</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;font-family:system-ui,'Malgun Gothic',sans-serif;color:#182b3c}.shell{max-width:460px;margin:0 auto;min-height:100dvh;padding:30px 20px;display:flex;flex-direction:column;justify-content:center}.brand{text-align:center;margin-bottom:32px}.logo{width:82px;height:82px;border-radius:23px;background:#132d44;color:white;margin:0 auto 18px;display:grid;place-items:center;font-size:35px;font-weight:900;letter-spacing:-3px}.brand h1{font-size:26px;margin:0}.brand p{font-size:14px;color:#617181}.card{background:white;border:1px solid #dbe3eb;border-radius:17px;padding:22px;margin-bottom:13px;text-align:left;width:100%;cursor:pointer}.card strong{font-size:19px;display:block;margin-bottom:7px}.card span{font-size:14px;color:#647484}.card:focus-visible{outline:3px solid #3185c5}.note{font-size:13px;color:#596d7d;line-height:1.7;margin-top:18px}.error{color:#a32434;font-size:13px;min-height:18px}.footer{font-size:12px;color:#7b8994;text-align:center;margin-top:20px}</style></head><body><main class="shell"><div class="brand"><div class="logo">B</div><h1>BFLAB MOTORS</h1><p>비플랩모터스 통합 접속</p></div><button class="card" id="rider"><strong>🏍️ 기사용</strong><span>정비 접수 · 신규 등록 · 재방문 · PIN 재설정</span></button><button class="card" id="staff"><strong>🔧 정비사용</strong><span>접수 관리 · 할인 조회 · 정비 완료 · 장부 반영</span></button><p class="note">현재는 기존 운영 웹앱으로 연결되는 1단계 버전입니다. 기사 PIN과 정비사 구글 계정 인증은 기존 웹앱에서 처리합니다. 통합 자동 로그인은 아직 적용되지 않았습니다.</p><p id="error" class="error" role="status"></p><p class="footer">BFLAB MOTORS</p></main><script src="config.js"></script><script>function go(role){const url=window.BFLAB_LINKS&&window.BFLAB_LINKS[role];if(!url||!/^https:\/\/script\.google\.com\/macros\/s\//.test(url)){document.getElementById('error').textContent='아직 '+(role==='rider'?'기사용':'정비사용')+' 웹앱 주소가 설정되지 않았습니다. config.js를 확인하세요.';return}window.location.assign(url)}document.getElementById('rider').addEventListener('click',()=>go('rider'));document.getElementById('staff').addEventListener('click',()=>go('staff'));if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
