<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132d44"><meta name="description" content="비플랩모터스 기사·정비사 통합 접속"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>BFLAB MOTORS</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;font-family:system-ui,'Malgun Gothic',sans-serif;color:#182b3c}.shell{max-width:460px;margin:0 auto;min-height:100dvh;padding:30px 20px;display:flex;flex-direction:column;justify-content:center}.brand{text-align:center;margin-bottom:32px}.logo{width:82px;height:82px;border-radius:23px;background:#132d44;color:white;margin:0 auto 18px;display:grid;place-items:center;font-size:35px;font-weight:900;letter-spacing:-3px}.brand h1{font-size:26px;margin:0}.brand p{font-size:14px;color:#617181}.card{background:white;border:1px solid #dbe3eb;border-radius:17px;padding:22px;margin-bottom:13px;text-align:left;width:100%;cursor:pointer}.card strong{font-size:19px;display:block;margin-bottom:7px}.card span{font-size:14px;color:#647484}.card:focus-visible{outline:3px solid #3185c5}.note{font-size:13px;color:#596d7d;line-height:1.7;margin-top:18px}.error{color:#a32434;font-size:13px;min-height:18px}.install-panel{background:#fff;border:1px solid #dbe3eb;border-radius:17px;padding:18px;margin:0 0 16px;text-align:center}.install-button{width:100%;padding:15px;border:0;border-radius:11px;background:#176a43;color:white;font-size:17px;font-weight:700;cursor:pointer}.install-help{font-size:13px;color:#596d7d;line-height:1.65;margin:10px 0 0}.footer{font-size:12px;color:#7b8994;text-align:center;margin-top:20px}</style></head><body><main class="shell"><div class="brand"><div class="logo">B</div><h1>BFLAB MOTORS</h1><p>비플랩모터스 통합 접속</p></div><section class="install-panel" id="installPanel" hidden><button type="button" class="install-button" id="installButton">📲 앱 설치하기</button><p class="install-help">설치 확인창이 뜨면 설치를 눌러주세요.</p></section><p class="install-help" id="installHelp" hidden></p><button class="card" id="rider"><strong>🏍️ 기사용</strong><span>정비 접수 · 신규 등록 · 재방문 · PIN 재설정</span></button><button class="card" id="staff"><strong>🔧 정비사용</strong><span>접수 관리 · 할인 조회 · 정비 완료 · 장부 반영</span></button><p class="note">현재는 기존 운영 웹앱으로 연결되는 1단계 버전입니다. 기사 PIN과 정비사 구글 계정 인증은 기존 웹앱에서 처리합니다. 통합 자동 로그인은 아직 적용되지 않았습니다.</p><p id="error" class="error" role="status"></p><p class="footer">BFLAB MOTORS</p></main><script src="config.js"></script><script>function go(role){const url=window.BFLAB_LINKS&&window.BFLAB_LINKS[role];if(!url||!/^https:\/\/script\.google\.com\/macros\/s\//.test(url)){document.getElementById('error').textContent='아직 '+(role==='rider'?'기사용':'정비사용')+' 웹앱 주소가 설정되지 않았습니다. config.js를 확인하세요.';return}window.location.assign(url)}document.getElementById('rider').addEventListener('click',()=>go('rider'));document.getElementById('staff').addEventListener('click',()=>go('staff'));let deferredInstallPrompt=null;
const installPanel=document.getElementById('installPanel');
const installButton=document.getElementById('installButton');
const installHelp=document.getElementById('installHelp');
const installed=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;if(!installed()){installPanel.hidden=false;installHelp.hidden=true;}});
installButton.addEventListener('click',async()=>{
  if(!deferredInstallPrompt)return;
  const prompt=deferredInstallPrompt;deferredInstallPrompt=null;installPanel.hidden=true;
  try{await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome!=='accepted'){installHelp.hidden=false;installHelp.textContent='설치를 취소했어요. 나중에 브라우저 메뉴에서 다시 설치할 수 있습니다.';}}
  catch(e){installHelp.hidden=false;installHelp.textContent='설치창을 열 수 없습니다. 브라우저의 홈 화면에 추가 메뉴를 이용해 주세요.';}
});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installPanel.hidden=true;installHelp.hidden=true;});
if(!installed())setTimeout(()=>{if(!deferredInstallPrompt){installHelp.hidden=false;installHelp.textContent=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'아이폰은 공유 메뉴에서 홈 화면에 추가를 선택해 주세요.':'설치 버튼이 보이지 않으면 Chrome에서 이 주소를 직접 열고 메뉴의 홈 화면에 추가를 확인해 주세요. 이미 설치된 경우에도 버튼이 나타나지 않을 수 있습니다.';}},1800);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
